name: Build TurkishAI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Java 21 kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Maven ile derle
        run: mvn clean package

      - name: JAR'ı yükle
        uses: actions/upload-artifact@v4
        with:
          name: TurkishAI-JAR
          path: target/*.jar
